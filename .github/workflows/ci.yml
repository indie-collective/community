name: CI

on:
  pull_request:
  push:
    branches: [main, migration/chakra-v3]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit and story tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Don't rely on @prisma/client's install hook: it sometimes leaves no
      # generated client, and seeding then fails with "did not initialize yet".
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:stories
      - run: npm run build-storybook

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: indieco
          POSTGRES_PASSWORD: indieco
          POSTGRES_DB: indieco
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U indieco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://indieco:indieco@localhost:5432/indieco
      # auth.server.js exits at startup without these; the tests sign in with
      # the development-only form strategy, so the values are never used.
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_BOT_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Don't rely on @prisma/client's install hook: it sometimes leaves no
      # generated client, and seeding then fails with "did not initialize yet".
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: node prisma/seed.js
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
