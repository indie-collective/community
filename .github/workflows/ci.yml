name: CI

on:
  pull_request:
  push:
    branches: [main, migration/chakra-v3]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit and story tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:stories
      - run: npm run build-storybook

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # The tests run against a build of the Worker in workerd, on a fresh
    # local D1 and R2, with test variables (see scripts/e2e-server.mjs).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
